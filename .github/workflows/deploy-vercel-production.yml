name: Deploy Vercel Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA currently at main
        required: true
        type: string
      confirmation:
        description: Type PROMOTE RETIRED RELEASE_FORMS to approve the inactive canary and production promotion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-vercel-${{ github.repository }}
  # Never interrupt an immutable build, canary, promotion, or its evidence.
  cancel-in-progress: false

jobs:
  canary-and-promote:
    if: vars.ENABLE_RELEASE_FORMS_PRODUCTION_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      EXPECTED_VERCEL_ORG_ID: team_dYh8hnyuxB6dbWOjq34jIHNg
      EXPECTED_VERCEL_PROJECT_ID: prj_AgFYzaxmaGGuLPQnxkeSfzLawwMX
      EXPECTED_VERCEL_PROJECT_NAME: release-forms
      EXPECTED_PRODUCTION_ALIAS: release-forms.vercel.app
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Require explicit retired-app confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PROMOTE RETIRED RELEASE_FORMS" || {
            echo "::error::Type PROMOTE RETIRED RELEASE_FORMS to authorize this inactive-app promotion."
            exit 1
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::A full 40-character release SHA is required."
            exit 1
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact current main before building
        run: node scripts/ci/assert-deploy-sha.mjs "$RELEASE_SHA"

      - name: Initialize release evidence after checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-evidence
          printf '{"schema":1,"repository":"%s","sha":"%s","run_id":"%s","status":"started","runtime":"inactive"}\n' \
            "$GITHUB_REPOSITORY" "${RELEASE_SHA,,}" "$GITHUB_RUN_ID" > release-evidence/deployment-evidence.json

      - name: Install and retest locked inactive source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm run ci:secrets
          npm run test:security
          npm run build
          cp -a -- dist "$RUNNER_TEMP/reviewed-dist"
          node scripts/verify-production-artifact.mjs "$RUNNER_TEMP/reviewed-dist"

      - name: Enforce the exact dedicated non-Git Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" || {
            echo "::error::The Production environment is missing a required Vercel secret."
            exit 1
          }
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_VERCEL_PROJECT_ID" || {
            echo "::error::VERCEL_PROJECT_ID does not identify the source-pinned release-forms project."
            exit 1
          }
          test "$VERCEL_ORG_ID" = "$EXPECTED_VERCEL_ORG_ID" || {
            echo "::error::VERCEL_ORG_ID does not identify the source-pinned release-forms account."
            exit 1
          }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > "$RUNNER_TEMP/vercel-project.json"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.id!==process.env.EXPECTED_VERCEL_PROJECT_ID||p.name!==process.env.EXPECTED_VERCEL_PROJECT_NAME||p.accountId!==process.env.EXPECTED_VERCEL_ORG_ID)throw new Error("Unexpected Vercel project or account response.");if(p.link!=null)throw new Error("Git integration must be disconnected before this dormant publisher can be enabled.");' "$RUNNER_TEMP/vercel-project.json"

      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.10.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify linked Vercel project
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(".vercel/project.json","utf8"));if(p.orgId!==process.env.EXPECTED_VERCEL_ORG_ID||p.projectId!==process.env.EXPECTED_VERCEL_PROJECT_ID)throw new Error("Vercel link does not match the exact source-pinned account and dedicated production project.")'

      - name: Build and verify the immutable inactive artifact once
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.10.0 build --prod
          node scripts/ci/verify-vercel-output.mjs .vercel/output "$RUNNER_TEMP/reviewed-dist"
          artifact_digest="$(find .vercel/output -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "ARTIFACT_DIGEST=$artifact_digest" >> "$GITHUB_ENV"

      - name: Capture complete rollback alias inventory
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/capture-vercel-rollback.mjs release-evidence/rollback-inventory.json

      - name: Deploy the prebuilt inactive artifact without assigning a domain
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@59.10.0 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+[.]vercel[.]app/?$ ]] || {
            echo "::error::Vercel did not return a valid unaliased deployment URL."
            exit 1
          }
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Resolve exact canary deployment identity
        id: identity
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.10.0 inspect "$DEPLOYMENT_URL" --json --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/canary-deployment.json"
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const host=process.env.DEPLOYMENT_URL.replace(/^https:\/\//,"").replace(/\/$/,"");if(!/^dpl_[A-Za-z0-9]+$/.test(d.id||"")||d.name!==process.env.EXPECTED_VERCEL_PROJECT_NAME||d.target!=="production"||d.readyState!=="READY"||d.url!==host)throw new Error("The canary identity does not match the exact dedicated production deployment.");' "$RUNNER_TEMP/canary-deployment.json"
          echo "deployment_id=$(jq -r .id "$RUNNER_TEMP/canary-deployment.json")" >> "$GITHUB_OUTPUT"

      - name: Enumerate and bind the complete provider deployment file tree
        env:
          DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/capture-vercel-deployment-files.mjs \
            "$RUNNER_TEMP/reviewed-dist" .vercel/output \
            release-evidence/deployment-file-inventory.json

      - name: Canary exact inactive bytes, headers, and paths
        env:
          DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-static" "$RUNNER_TEMP/live-artifact-headers" "$RUNNER_TEMP/live-routes"
          jq -er \
            'if .schema == 1 and .complete == true and (.files | type == "array") and (.files | length > 0) then .files[] else error("invalid provider deployment file inventory") end' \
            release-evidence/deployment-file-inventory.json > "$RUNNER_TEMP/provider-static-files"
          while IFS= read -r artifact; do
            [[ "$artifact" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "/$artifact/" != *"/../"* ]] && [[ "$artifact" != /* ]] || {
              echo "::error::Provider inventory contained an unsafe static path."
              exit 1
            }
            mkdir -p "$RUNNER_TEMP/live-static/$(dirname "$artifact")"
            mkdir -p "$RUNNER_TEMP/live-artifact-headers/$(dirname "$artifact")"
            status="$(npx --yes vercel@59.10.0 curl "/$artifact" --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" -- \
              --silent --show-error --output "$RUNNER_TEMP/live-static/$artifact" \
              --dump-header "$RUNNER_TEMP/live-artifact-headers/$artifact" --write-out '%{http_code}')"
            test "$status" = "200" || { echo "::error::/$artifact returned HTTP $status."; exit 1; }
          done < "$RUNNER_TEMP/provider-static-files"
          capture_route() {
            local path="$1" label="$2"
            local status
            status="$(npx --yes vercel@59.10.0 curl "$path" --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" -- \
              --silent --show-error --user-agent 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) Mobile/15E148 Safari/604.1' \
              --output "$RUNNER_TEMP/live-routes/$label.body" \
              --dump-header "$RUNNER_TEMP/live-routes/$label.headers" --write-out '%{http_code}')"
            printf '%s\n' "$status" > "$RUNNER_TEMP/live-routes/$label.status"
          }
          capture_route / index
          capture_route /client client
          capture_route /staff staff
          node scripts/ci/verify-live-vercel-canary.mjs \
            "$RUNNER_TEMP/reviewed-dist" "$RUNNER_TEMP/live-static" "$RUNNER_TEMP/live-artifact-headers" \
            "$RUNNER_TEMP/live-routes" \
            release-evidence/deployment-file-inventory.json \
            release-evidence/canary-evidence.json

      - name: Persist full promotion intent before provider mutation
        id: intent
        env:
          DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          node -e 'const fs=require("fs");const e=process.env;const rollback=JSON.parse(fs.readFileSync("release-evidence/rollback-inventory.json","utf8"));const canary=JSON.parse(fs.readFileSync("release-evidence/canary-evidence.json","utf8"));const intent={schema:1,repository:e.GITHUB_REPOSITORY,sha:e.RELEASE_SHA.toLowerCase(),run_id:e.GITHUB_RUN_ID,org_id:e.EXPECTED_VERCEL_ORG_ID,project_id:e.EXPECTED_VERCEL_PROJECT_ID,project_name:e.EXPECTED_VERCEL_PROJECT_NAME,expected_production_alias:e.EXPECTED_PRODUCTION_ALIAS,deployment_id:e.DEPLOYMENT_ID,deployment_url:e.DEPLOYMENT_URL,artifact_sha256:e.ARTIFACT_DIGEST,provider_file_inventory_sha256:canary.provider_inventory_sha256,rollback_deployment_id:rollback.deployment_id,rollback_inventory:rollback,canary_verified:true,runtime:"inactive",status:"promotion_intent",operator_action:"If final evidence is absent or uncertain: Do not retry promotion blindly. Reconcile every alias in rollback_inventory, then roll back only to rollback_deployment_id if needed."};fs.writeFileSync("release-evidence/promotion-intent.json",JSON.stringify(intent)+"\n");fs.writeFileSync("release-evidence/deployment-evidence.json",JSON.stringify(intent)+"\n");'

      - name: Retain immutable pre-promotion intent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-promotion-intent-${{ inputs.release_sha }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Revalidate rollback aliases immediately before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/capture-vercel-rollback.mjs "$RUNNER_TEMP/rollback-inventory-recheck.json"
          cmp --silent release-evidence/rollback-inventory.json "$RUNNER_TEMP/rollback-inventory-recheck.json" || {
            echo "::error::Production alias ownership changed after the rollback inventory was captured. Do not promote."
            exit 1
          }

      - name: Recheck current main immediately before promotion
        run: node scripts/ci/assert-deploy-sha.mjs "$RELEASE_SHA"

      - name: Promote the exact inactive canary without rebuilding
        id: promote
        continue-on-error: true
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set +e
          npx --yes vercel@59.10.0 promote "$DEPLOYMENT_URL" --yes --timeout=2m --token="$VERCEL_TOKEN"
          promote_exit=$?
          echo "exit_code=$promote_exit" >> "$GITHUB_OUTPUT"
          exit "$promote_exit"

      - name: Always reconcile provider promotion state
        if: always() && steps.intent.outcome == 'success'
        env:
          CLI_EXIT_CODE: ${{ steps.promote.outputs.exit_code || '124' }}
          DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/ci/reconcile-vercel-promotion.mjs release-evidence/promotion-intent.json release-evidence/deployment-evidence.json

      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-deployment-evidence-${{ inputs.release_sha }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 90

  attest-release:
    needs: canary-and-promote
    if: vars.ENABLE_RELEASE_FORMS_PRODUCTION_DEPLOYMENT == 'true' && vars.ENABLE_GITHUB_ARTIFACT_ATTESTATIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the exact release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vercel-deployment-evidence-${{ inputs.release_sha }}
          path: release-evidence
      - name: Sign successful release evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-evidence/deployment-evidence.json
