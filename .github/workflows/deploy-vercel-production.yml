name: Deploy Vercel Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA currently at main
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: production-vercel-${{ github.repository }}
  # Preserve deployment evidence; a newer release waits and rechecks main.
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: >-
      vars.ENABLE_RELEASE_FORMS_PRODUCTION_DEPLOYMENT == 'true' &&
      ((github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      DEPLOYMENT_ENABLED: ${{ vars.ENABLE_RELEASE_FORMS_PRODUCTION_DEPLOYMENT }}
    steps:
      - name: Resolve release SHA
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then sha="$UPSTREAM_SHA"; else sha="$MANUAL_SHA"; fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then echo "A full release SHA is required."; exit 1; fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/ci/assert-deploy-sha.mjs "${{ steps.release.outputs.sha }}"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run ci:secrets
      - run: npm run test:security
      - run: npm run build

      - name: Enforce explicit activation and provider configuration
        id: activation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          if [ "$DEPLOYMENT_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The incomplete replacement release-form app remains intentionally undeployed. Set ENABLE_RELEASE_FORMS_PRODUCTION_DEPLOYMENT=true only after product acceptance."
          elif [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Production deployment is enabled but Vercel credentials are incomplete."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull production configuration
        if: steps.activation.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.10.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Verify linked Vercel project
        if: steps.activation.outputs.enabled == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(".vercel/project.json","utf8"));if(p.orgId!==process.env.VERCEL_ORG_ID||p.projectId!==process.env.VERCEL_PROJECT_ID)throw new Error("Vercel link does not match configured production project IDs.")'
      - name: Build immutable production artifact
        if: steps.activation.outputs.enabled == 'true'
        # `vercel pull` persisted the authenticated production settings for
        # offline build. Do not expose provider credentials to build scripts.
        run: npx --yes vercel@59.10.0 build --prod
      - name: Deploy unaliased, verify the exact canary, and promote it
        if: steps.activation.outputs.enabled == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/assert-deploy-sha.mjs "$RELEASE_SHA"
          deployment_url="$(npx --yes vercel@59.10.0 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+[.]vercel[.]app/?$ ]] || {
            echo "::error::Vercel did not return a valid unaliased deployment URL."
            exit 1
          }
          status="$(npx --yes vercel@59.10.0 curl / --deployment "$deployment_url" --token="$VERCEL_TOKEN" -- \
            --silent --show-error --output canary-body.html --dump-header canary-headers.txt --write-out '%{http_code}')"
          test "$status" = "200" || { echo "::error::Exact canary returned HTTP $status."; exit 1; }
          grep -Fq "This standalone form is not active." canary-body.html
          tr -d '\r' < canary-headers.txt > canary-headers.normalized.txt
          grep -Eiq "^content-security-policy:.*frame-ancestors[[:space:]]+'none'" canary-headers.normalized.txt
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' canary-headers.normalized.txt
          grep -Eiq '^cache-control:.*no-store' canary-headers.normalized.txt
          node scripts/ci/assert-deploy-sha.mjs "$RELEASE_SHA"
          npx --yes vercel@59.10.0 promote "$deployment_url" --yes --token="$VERCEL_TOKEN"
          artifact_digest="$(find .vercel/output -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          printf '{"schema":1,"repository":"%s","sha":"%s","run_id":"%s","deployment_url":"%s","artifact_sha256":"%s","canary_verified":true,"promoted":true}\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$GITHUB_RUN_ID" "$deployment_url" "$artifact_digest" > vercel-deployment-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.activation.outputs.enabled == 'true'
        with:
          name: vercel-deployment-evidence-${{ steps.release.outputs.sha }}
          path: vercel-deployment-evidence.json
          retention-days: 90
      - name: Sign release evidence when GitHub attestations are supported
        if: steps.activation.outputs.enabled == 'true' && vars.ENABLE_GITHUB_ARTIFACT_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: vercel-deployment-evidence.json
