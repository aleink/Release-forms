name: Scheduled security and supply-chain monitoring

on:
  schedule:
    - cron: '47 8 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: read

concurrency:
  group: security-monitoring-${{ github.repository }}
  cancel-in-progress: true

jobs:
  source-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run ci:secrets
      - run: npm run test:security
      - run: npm run build
      - run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

  verified-history-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          base: ''
          head: HEAD
          extra_args: --results=verified
          version: 3.97.1

  codeql-local-sarif:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: never
          upload-database: false
          output: codeql-results
      - name: Verify CodeQL SARIF evidence
        shell: bash
        run: |
          set -euo pipefail
          sarif_files=()
          while IFS= read -r -d '' sarif; do
            sarif_files+=("$sarif")
          done < <(find codeql-results -type f -name '*.sarif' -print0 | sort -z)
          test "${#sarif_files[@]}" -gt 0 || {
            echo "::error::CodeQL produced no SARIF files."
            exit 1
          }
          : > codeql-results/SHA256SUMS
          result_count=0
          for sarif in "${sarif_files[@]}"; do
            jq -e '
              .version == "2.1.0"
              and (.runs | type == "array" and length > 0)
              and all(.runs[];
                ((.tool.driver.name | type) == "string")
                and (.tool.driver.name | length > 0)
                and ((.results | type) == "array")
              )
            ' "$sarif" >/dev/null
            count="$(jq '[.runs[].results[]?] | length' "$sarif")"
            result_count=$((result_count + count))
            digest="$(sha256sum "$sarif" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "${sarif#codeql-results/}" >> codeql-results/SHA256SUMS
          done
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --argjson sarif_count "${#sarif_files[@]}" \
            --argjson result_count "$result_count" \
            '{schemaVersion: 1, repository: $repository, sha: $sha, runId: $run_id, workflow: $workflow, sarifCount: $sarif_count, resultCount: $result_count}' \
            > codeql-results/evidence.json
          {
            echo "### CodeQL local SARIF evidence"
            echo "- Validated SARIF files: ${#sarif_files[@]}"
            echo "- Results requiring review: $result_count"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result_count" -gt 0 ]; then
            echo "::warning::Validated CodeQL SARIF contains $result_count result(s); review the retained artifact."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 90
